[pytest]
testpaths = tests
markers =
    seed: valida o estado do banco recem-populado pelo seed em lote.
        Assume contagens exatas (5.000 avaliacoes / 5.000 predicoes), premissa
        que a ingestao via API invalida. Excluido da suite padrao; rode com
        'pytest -m seed' logo apos scripts/seed_supabase.py.
    rede: depende do Supabase real (rede + credenciais no .env). Pulado sem
        credenciais; a CI exclui com -m "not seed and not rede".
# --strict-markers: marker digitado errado vira erro, em vez de um teste que
# nunca e selecionado nem excluido.
addopts = -m "not seed" --strict-markers
